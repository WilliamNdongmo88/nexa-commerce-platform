name: nexa-commerce-platform

services:
  # ============================================================
  # INFRASTRUCTURE
  # ============================================================

  eureka-server:
    image: microservices/eureka-server:1.0.0
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8762:8761"
    networks:
      - nexa-commerce-platform-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  config-server:
    image: microservices/config-server:1.0.0
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8889:8888"
    environment:
      EUREKA_HOST: eureka-server
      EUREKA_USER: admin
      EUREKA_PASSWORD: admin123
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - nexa-commerce-platform-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://config:config123@localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  api-gateway:
    image: microservices/api-gateway:1.0.0
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8180:8080"
    environment:
      EUREKA_HOST: eureka-server
      EUREKA_USER: admin
      EUREKA_PASSWORD: admin123
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_USER: config
      CONFIG_SERVER_PASSWORD: config123
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - nexa-commerce-platform-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ============================================================
  # BASES DE DONNÉES POSTGRESQL
  # ============================================================

  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5442:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks:
      - nexa-commerce-platform-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-user:
    image: postgres:16-alpine
    container_name: postgres-user
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_pass
    ports:
      - "5443:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    networks:
      - nexa-commerce-platform-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-product:
    image: postgres:16-alpine
    container_name: postgres-product
    restart: unless-stopped
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: product_user
      POSTGRES_PASSWORD: product_pass
    ports:
      - "5444:5432"
    volumes:
      - postgres-product-data:/var/lib/postgresql/data
    networks:
      - nexa-commerce-platform-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_user -d product_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-inventory:
    image: postgres:16-alpine
    container_name: postgres-inventory
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
    ports:
      - "5445:5432"
    volumes:
      - postgres-inventory-data:/var/lib/postgresql/data
    networks:
      - nexa-commerce-platform-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-order:
    image: postgres:16-alpine
    container_name: postgres-order
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
    ports:
      - "5446:5432"
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    networks:
      - nexa-commerce-platform-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-payment:
    image: postgres:16-alpine
    container_name: postgres-payment
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
    ports:
      - "5447:5432"
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
    networks:
      - nexa-commerce-platform-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-notification:
    image: postgres:16-alpine
    container_name: postgres-notification
    restart: unless-stopped
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_pass
    ports:
      - "5448:5432"
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
    networks:
      - nexa-commerce-platform-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # KAFKA
  # ============================================================

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - nexa-commerce-platform-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ============================================================
  # SERVICES MÉTIER
  # ============================================================

  auth-service:
    image: microservices/auth-service:1.0.0
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "8181:8081"
    environment:
      EUREKA_HOST: eureka-server
      EUREKA_USER: admin
      EUREKA_PASSWORD: admin123
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_USER: config
      CONFIG_SERVER_PASSWORD: config123
      AUTH_DB_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      config-server:
        condition: service_healthy
      postgres-auth:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - nexa-commerce-platform-net

  user-service:
    image: microservices/user-service:1.0.0
    container_name: user-service
    restart: unless-stopped
    ports:
      - "8182:8082"
    environment:
      EUREKA_HOST: eureka-server
      EUREKA_USER: admin
      EUREKA_PASSWORD: admin123
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_USER: config
      CONFIG_SERVER_PASSWORD: config123
      USER_DB_URL: jdbc:postgresql://postgres-user:5432/user_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENABLED: "true"
    depends_on:
      config-server:
        condition: service_healthy
      postgres-user:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - nexa-commerce-platform-net

  product-service:
    image: microservices/product-service:1.0.0
    container_name: product-service
    restart: unless-stopped
    ports:
      - "8183:8083"
    environment:
      EUREKA_HOST: eureka-server
      EUREKA_USER: admin
      EUREKA_PASSWORD: admin123
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_USER: config
      CONFIG_SERVER_PASSWORD: config123
      PRODUCT_DB_URL: jdbc:postgresql://postgres-product:5432/product_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENABLED: "true"
    depends_on:
      config-server:
        condition: service_healthy
      postgres-product:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - nexa-commerce-platform-net

  inventory-service:
    image: microservices/inventory-service:1.0.0
    container_name: inventory-service
    restart: unless-stopped
    ports:
      - "8184:8084"
    environment:
      EUREKA_HOST: eureka-server
      EUREKA_USER: admin
      EUREKA_PASSWORD: admin123
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_USER: config
      CONFIG_SERVER_PASSWORD: config123
      INVENTORY_DB_URL: jdbc:postgresql://postgres-inventory:5432/inventory_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENABLED: "true"
    depends_on:
      config-server:
        condition: service_healthy
      postgres-inventory:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - nexa-commerce-platform-net

  order-service:
    image: microservices/order-service:1.0.0
    container_name: order-service
    restart: unless-stopped
    ports:
      - "8185:8085"
    environment:
      EUREKA_HOST: eureka-server
      EUREKA_USER: admin
      EUREKA_PASSWORD: admin123
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_USER: config
      CONFIG_SERVER_PASSWORD: config123
      ORDER_DB_URL: jdbc:postgresql://postgres-order:5432/order_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENABLED: "true"
    depends_on:
      config-server:
        condition: service_healthy
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - nexa-commerce-platform-net

  payment-service:
    image: microservices/payment-service:1.0.0
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "8186:8086"
    environment:
      EUREKA_HOST: eureka-server
      EUREKA_USER: admin
      EUREKA_PASSWORD: admin123
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_USER: config
      CONFIG_SERVER_PASSWORD: config123
      PAYMENT_DB_URL: jdbc:postgresql://postgres-payment:5432/payment_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENABLED: "true"
    depends_on:
      config-server:
        condition: service_healthy
      postgres-payment:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - nexa-commerce-platform-net

  notification-service:
    image: microservices/notification-service:1.0.0
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "8187:8087"
    environment:
      EUREKA_HOST: eureka-server
      EUREKA_USER: admin
      EUREKA_PASSWORD: admin123
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_USER: config
      CONFIG_SERVER_PASSWORD: config123
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres-notification:5432/notification_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENABLED: "true"
    depends_on:
      config-server:
        condition: service_healthy
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - nexa-commerce-platform-net

  # ============================================================
  # OBSERVABILITÉ
  # ============================================================

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - nexa-commerce-platform-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - nexa-commerce-platform-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - nexa-commerce-platform-net

  # ============================================================
  # OUTILS DE DEV
  # ============================================================

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8090:8080"
    depends_on:
      - postgres-auth
      - postgres-user
      - postgres-product
      - postgres-inventory
      - postgres-order
      - postgres-payment
      - postgres-notification
    networks:
      - nexa-commerce-platform-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8091:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - nexa-commerce-platform-net

# ============================================================
# RÉSEAU
# ============================================================
networks:
  nexa-commerce-platform-net:
    name: nexa-commerce-platform-net
    driver: bridge

# ============================================================
# VOLUMES
# ============================================================
volumes:
  postgres-auth-data:
    name: microservices-postgres-auth-data
  postgres-user-data:
    name: microservices-postgres-user-data
  postgres-product-data:
    name: microservices-postgres-product-data
  postgres-inventory-data:
    name: microservices-postgres-inventory-data
  postgres-order-data:
    name: microservices-postgres-order-data
  postgres-payment-data:
    name: microservices-postgres-payment-data
  postgres-notification-data:
    name: microservices-postgres-notification-data
  kafka-data:
    name: microservices-kafka-data
  prometheus-data:
    name: microservices-prometheus-data
  grafana-data:
    name: microservices-grafana-data