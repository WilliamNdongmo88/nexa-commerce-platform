name: CI - Build & Push

# ============================================================
# TRIGGERS
# ============================================================
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:   # permet de lancer manuellement

# ============================================================
# VARIABLES GLOBALES
# ============================================================
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # ex: username/nexa-commerce-platform
  JAVA_VERSION: '21'

# ============================================================
# JOBS
# ============================================================
jobs:

  # ========================================================
  # JOB 1 : BUILD & TEST (Maven)
  # ========================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test all modules
        run: mvn clean verify -B

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco/
          retention-days: 7

  # ========================================================
  # JOB 2 : BUILD & PUSH DOCKER IMAGES (Matrix 10 images)
  # ========================================================
  docker-build:
    name: Docker Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build-and-test   # attend que le job 1 soit vert
    if: github.event_name != 'pull_request'   # pas de push sur PR
    permissions:
      contents: read
      packages: write       # autorisation de pousser sur GHCR

    strategy:
      fail-fast: false   # continue même si une image échoue
      matrix:
        include:
          - service: eureka-server
            dockerfile: infrastructure/eureka-server/Dockerfile
          - service: config-server
            dockerfile: infrastructure/config-server/Dockerfile
          - service: api-gateway
            dockerfile: infrastructure/api-gateway/Dockerfile
          - service: auth-service
            dockerfile: services/auth-service/Dockerfile
          - service: user-service
            dockerfile: services/user-service/Dockerfile
          - service: product-service
            dockerfile: services/product-service/Dockerfile
          - service: inventory-service
            dockerfile: services/inventory-service/Dockerfile
          - service: order-service
            dockerfile: services/order-service/Dockerfile
          - service: payment-service
            dockerfile: services/payment-service/Dockerfile
          - service: notification-service
            dockerfile: services/notification-service/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max