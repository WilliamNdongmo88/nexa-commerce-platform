server:
  port: 8080

spring:
  application:
    name: api-gateway

  # ============================================
  # Routes de la Gateway
  # ============================================
  cloud:
    gateway:
      # Active la découverte Eureka pour les routes
      discovery:
        locator:
          enabled: false   # On préfère les routes statiques (plus explicites et sécurisées)
          lower-case-service-id: true

      # Routes statiques
      routes:
        # ---------- AUTH ----------
        - id: auth-service
          uri: lb://auth-service        # lb:// = load balanced via Eureka
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0

        # ---------- USERS ----------
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - StripPrefix=0

        # ---------- PRODUCTS ----------
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**
          filters:
            - StripPrefix=0

        # ---------- INVENTORY ----------
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            - StripPrefix=0

        # ---------- ORDERS ----------
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - StripPrefix=0

        # ---------- PAYMENTS ----------
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - StripPrefix=0

      # ---------- CORS global ----------
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"    # Frontend dev
              - "http://localhost:4200"    # Angular dev
              - "https://app.example.com"  # Prod
            allowed-methods: "*"
            allowed-headers: "*"
            exposed-headers:
              - "X-Trace-Id"
              - "X-User-Id"
            allow-credentials: true
            max-age: 3600

  # ============================================
  # JWT (clé publique RSA - sera chargée via JWKS en prod)
  # ============================================
jwt:
  # En dev : clé publique en Base64 (sera remplacée par JWKS)
  # Pour l'instant on utilise HS256 partagé avec auth-service
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  issuer: auth-service
  audience: microservices-platform
  public-endpoints:
    - "POST:/api/v1/auth/register"
    - "POST:/api/v1/auth/login"
    - "POST:/api/v1/auth/refresh"

  # Endpoints publics en GET uniquement
  public-get-prefixes:
    - "/api/v1/products"

  # Règles de rôles
  admin-only:
    - "POST:/api/v1/products"
    - "PUT:/api/v1/products/**"
    - "DELETE:/api/v1/products/**"

# ============================================
# Eureka
# ============================================
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:admin}:${EUREKA_PASSWORD:admin123}@${EUREKA_HOST:localhost}:8761/eureka/
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# ============================================
# Actuator
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway,refresh
  endpoint:
    health:
      show-details: always
  health:
    # Évite les faux DOWN quand un service est momentanément indisponible
    discovery:
      enabled: false

logging:
  level:
    com.microservices.gateway: DEBUG
    org.springframework.cloud.gateway: INFO