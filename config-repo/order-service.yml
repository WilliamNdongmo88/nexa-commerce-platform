server:
  port: 8085

spring:
  application:
    name: order-service

  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5446/order_db}
    username: ${ORDER_DB_USER:order_user}
    password: ${ORDER_DB_PASSWORD:order_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: order-service-cg
      auto-offset-commit: false
      enable-auto-commit: false

# ============================================
# Configuration des clients inter-services
# ============================================
app:
  clients:
    product-service:
      url: ${PRODUCT_SERVICE_URL:http://product-service}
      timeout: 5000
    inventory-service:
      url: ${INVENTORY_SERVICE_URL:http://inventory-service}
      timeout: 5000
    payment-service:
      url: ${PAYMENT_SERVICE_URL:http://payment-service}
      timeout: 10000
    user-service:
      url: ${USER_SERVICE_URL:http://user-service}
      timeout: 3000

  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topics:
      order-created: order.order.created
      order-confirmed: order.order.confirmed
      order-cancelled: order.order.cancelled

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.microservices.order: DEBUG
    org.springframework.web.reactive.function.client: INFO

# ============================================================
# RESILIENCE4J
# ============================================================
resilience4j:

  # ============================================
  # CIRCUIT BREAKER
  # ============================================
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
    instances:
      productService:
        baseConfig: default
      inventoryService:
        baseConfig: default
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        waitDurationInOpenState: 15s
      paymentService:
        baseConfig: default
      userService:
        baseConfig: default

  # ============================================
  # RETRY
  # ============================================
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - java.io.IOException
        ignoreExceptions:
          - com.microservices.order.exception.SagaFailedException
    instances:
      productService:
        baseConfig: default
      inventoryService:
        baseConfig: default
      paymentService:
        baseConfig: default
        maxAttempts: 2   # le paiement est critique, moins de retry
      userService:
        baseConfig: default

  # ============================================
  # TIMELIMITER
  # ============================================
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
        cancelRunningFuture: true
    instances:
      productService:
        baseConfig: default
      inventoryService:
        baseConfig: default
      paymentService:
        timeoutDuration: 10s
      userService:
        baseConfig: default

  # ============================================
  # BULKHEAD (limite les appels concurrents)
  # ============================================
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 20
        maxWaitDuration: 100ms
    instances:
      inventoryService:
        maxConcurrentCalls: 10   # critique

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh,circuitbreakers,circuitbreakerevents,retries,retryevents,bulkheads
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true